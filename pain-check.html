<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free Portfolio Audit — IP Axix</title>
<meta name="description" content="A free 3-minute portfolio pain check. Answer 7 quick questions and get a free deadline-exposure snapshot of up to 20 patents.">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Free Portfolio Audit — IP Axix">
<meta property="og:description" content="3-minute portfolio pain check. Get a free deadline-exposure snapshot for up to 20 patents.">
<meta property="og:type" content="website">
<link rel="icon" href="/ipaxix-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
  :root{
    --bg:#eef1f5; --card:#ffffff; --ink:#16273d; --ink-soft:#4a5a6f;
    --muted:#7c8798; --line:#dfe4ea; --line-soft:#eaeef3;
    --accent:#1f5f8b; --accent-wash:#e8f0f6;
    --gold:#a8791f; --gold-wash:#fbf4e6; --good:#1f7a54; --good-wash:#e6f2ec;
    --shadow:0 18px 48px rgba(20,39,61,.14),0 2px 8px rgba(20,39,61,.06);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e151e; --card:#151f2b; --ink:#eef3f8; --ink-soft:#b3c0cf;
    --muted:#8391a2; --line:#26323f; --line-soft:#1d2833;
    --accent:#5aa6d6; --accent-wash:#16283a;
    --gold:#d9b465; --gold-wash:#2a2416; --good:#5cc292; --good-wash:#12271e;
    --shadow:0 18px 48px rgba(0,0,0,.5); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0e151e; --card:#151f2b; --ink:#eef3f8; --ink-soft:#b3c0cf;
    --muted:#8391a2; --line:#26323f; --line-soft:#1d2833;
    --accent:#5aa6d6; --accent-wash:#16283a;
    --gold:#d9b465; --gold-wash:#2a2416; --good:#5cc292; --good-wash:#12271e;
    --shadow:0 18px 48px rgba(0,0,0,.5); color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;}
  img{max-width:100%}
  [hidden]{display:none!important}
  .wrap{max-width:600px;margin:0 auto;padding-block:28px;padding-left:18px;padding-right:18px;
    min-height:100%;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;text-decoration:none;color:inherit}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-family:"Source Serif 4",serif;font-weight:600;font-size:16px;flex-shrink:0}
  .brand b{font-weight:700;font-size:15px;letter-spacing:.01em}
  .brand span{color:var(--muted);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:26px 24px;flex:1;display:flex;flex-direction:column}
  @media(min-width:480px){.card{padding:32px 30px}}
  .bar{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:6px}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1);width:0}
  .step{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:22px}
  h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:30px;line-height:1.15;
    letter-spacing:-.01em;text-wrap:balance;margin:0 0 12px}
  .q{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:23px;line-height:1.22;
    text-wrap:balance;margin:0 0 4px}
  .hint{color:var(--ink-soft);font-size:14px;margin:0 0 20px}
  .lede{color:var(--ink-soft);font-size:15.5px;margin:0 0 26px;max-width:46ch}
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
  .opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:15px 16px;
    font:inherit;color:var(--ink);font-size:15.5px;font-weight:500;transition:border-color .15s,background .15s,transform .05s}
  .opt:hover{border-color:var(--accent);background:var(--accent-wash)}
  .opt:active{transform:scale(.994)}
  .opt .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;
    display:grid;place-items:center;transition:border-color .15s,background .15s}
  .opt.multi .tick{border-radius:6px}
  .opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-wash)}
  .opt[aria-checked="true"] .tick{border-color:var(--accent);background:var(--accent)}
  .opt[aria-checked="true"] .tick::after{content:"";width:9px;height:9px;border-radius:inherit;background:#fff}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
  .field label{font-size:13px;font-weight:600;color:var(--ink-soft)}
  .field input{font:inherit;font-size:15.5px;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:11px;background:var(--card);color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .foot{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:24px}
  .btn{font:inherit;font-weight:700;font-size:15px;border-radius:11px;padding:13px 22px;cursor:pointer;
    border:1.5px solid transparent;transition:opacity .15s,background .15s,transform .05s}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-primary{background:var(--accent);color:#fff;flex:1}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);padding-inline:16px}
  .multi-note{font-size:12.5px;color:var(--muted);margin:-2px 0 16px}
  .reward{display:flex;gap:11px;align-items:flex-start;background:var(--good-wash);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);
    border-radius:12px;padding:14px 15px;margin-bottom:22px}
  .reward b{color:var(--good);font-size:14px}
  .reward p{margin:2px 0 0;font-size:13.5px;color:var(--ink-soft)}
  .reward .ic{color:var(--good);flex-shrink:0;margin-top:1px}
  .done{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:10px 0}
  .done .badge{width:66px;height:66px;border-radius:50%;background:var(--good-wash);color:var(--good);display:grid;place-items:center;margin-bottom:20px}
  .done h1{margin-bottom:8px}
  .done p{color:var(--ink-soft);font-size:15.5px;max-width:42ch;margin:0 auto 8px}
  .foot-note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;padding-bottom:4px}
  .foot-note a{color:var(--muted)}
  .save-state{font-size:12.5px;margin-top:14px;padding:9px 12px;border-radius:9px;display:none}
  .save-state.warn{display:block;background:var(--gold-wash);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 28%,transparent)}
  .copybtn{background:none;border:1px solid var(--line);color:var(--ink-soft);font:inherit;font-size:12.5px;font-weight:600;
    border-radius:8px;padding:7px 12px;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/">
    <div class="mark">IP</div>
    <div><b>IP Axix</b><br><span>Portfolio pain check · 3 minutes</span></div>
  </a>
  <div class="card" id="card"></div>
  <div class="foot-note">Your answers are private and used only to prepare your audit. No spam. · <a href="/">ipaxix.online</a></div>
</div>

<script>
(function(){
  "use strict";
  var ENDPOINT="https://ooanilhblskuaasxyimw.supabase.co/functions/v1/survey-response";
  var KEY="sb_publishable_dQBbAXx5l_buD3m-HQieTA_UBQA125h";

  var STEPS = [
    { kind:"intro" },
    { id:"tracking", q:"How do you track patent deadlines today?", type:"single",
      opts:["Spreadsheets / calendar","A docketing tool","We rely on outside counsel","Nothing formal yet"] },
    { id:"jurisdictions", q:"Which jurisdictions is your portfolio in?", type:"multi",
      opts:["United States","Europe (EP)","India","Other / international"] },
    { id:"size", q:"Roughly how large is your portfolio?", type:"single",
      opts:["1–25 patents & applications","26–100","101–500","500+"] },
    { id:"worry", q:"What worries you most right now?", type:"multi",
      opts:["Missing a deadline","Too much manual admin","Renewal & maintenance costs","Understanding office actions","What competitors are filing"] },
    { id:"closecall", q:"Have you ever had a missed or near-missed deadline?", type:"single",
      opts:["Yes, it's happened","A close call once or twice","Never — but it's a constant worry","Not sure"] },
    { id:"timespend", q:"How much time each week goes to docketing & prosecution admin?", type:"single",
      opts:["Under 2 hours","2–5 hours","5+ hours","No idea, but too much"] },
    { id:"role", q:"Finally — what best describes you?", type:"single",
      opts:["In-house IP / patent manager","Attorney","Paralegal / docketing","Founder / business owner","Other"] },
    { kind:"capture" },
    { kind:"done" }
  ];

  var answers = {};
  var contact = { name:"", email:"", company:"" };
  var i = 0;
  var saved = false;
  var card = document.getElementById("card");
  var qSteps = STEPS.filter(function(s){ return s.id; });

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function progressPct(){
    var answeredIndex = STEPS.slice(0,i).filter(function(s){return s.id;}).length;
    return Math.round((answeredIndex/(qSteps.length+1))*100);
  }
  function barHTML(label){
    return '<div class="bar"><i style="width:'+progressPct()+'%"></i></div>'+
           (label?'<div class="step">'+label+'</div>':'');
  }
  function render(){
    var s = STEPS[i];
    if(s.kind==="intro") return renderIntro();
    if(s.kind==="capture") return renderCapture();
    if(s.kind==="done") return renderDone();
    return renderQuestion(s);
  }
  function renderIntro(){
    card.innerHTML =
      barHTML("") +
      '<h1>Is your patent portfolio quietly at risk?</h1>'+
      '<p class="lede">Answer 7 quick questions about how you manage your patents today. '+
      'It takes about 3 minutes — all clicks.</p>'+
      '<div class="reward"><span class="ic" aria-hidden="true">'+giftIcon()+'</span>'+
        '<div><b>Free portfolio audit at the end</b>'+
        '<p>Leave your email and we’ll send a free deadline-exposure snapshot for up to 20 of your patents — the risks and the quick wins.</p></div></div>'+
      '<div class="foot"><button class="btn btn-primary" id="next">Start the check →</button></div>';
    document.getElementById("next").onclick = go(1);
  }
  function renderQuestion(s){
    var cur = answers[s.id];
    var multi = s.type==="multi";
    var optsHTML = s.opts.map(function(o){
      var checked = multi ? (Array.isArray(cur)&&cur.indexOf(o)>=0) : (cur===o);
      return '<button class="opt'+(multi?' multi':'')+'" role="checkbox" aria-checked="'+(checked?"true":"false")+'" data-o="'+esc(o)+'">'+
             '<span class="tick"></span><span>'+esc(o)+'</span></button>';
    }).join("");
    card.innerHTML =
      barHTML("Question "+(qSteps.indexOf(s)+1)+" of "+qSteps.length) +
      '<p class="q">'+esc(s.q)+'</p>'+
      (multi?'<p class="multi-note">Choose all that apply.</p>':'<div style="height:14px"></div>')+
      '<div class="opts">'+optsHTML+'</div>'+
      '<div class="foot">'+
        '<button class="btn btn-ghost" id="back">Back</button>'+
        '<button class="btn btn-primary" id="next"'+(hasAns(s)?"":" disabled")+'>Next →</button>'+
      '</div>';
    Array.prototype.forEach.call(card.querySelectorAll(".opt"), function(btn){
      btn.onclick = function(){ pick(s, btn.getAttribute("data-o"), multi); };
    });
    document.getElementById("back").onclick = go(-1);
    document.getElementById("next").onclick = function(){ if(hasAns(s)) go(1)(); };
  }
  function hasAns(s){ var a=answers[s.id]; return s.type==="multi" ? (Array.isArray(a)&&a.length>0) : !!a; }
  function pick(s, val, multi){
    if(multi){
      var arr = Array.isArray(answers[s.id])?answers[s.id].slice():[];
      var at = arr.indexOf(val);
      if(at>=0) arr.splice(at,1); else arr.push(val);
      answers[s.id]=arr;
      renderQuestion(s);
    } else {
      answers[s.id]=val;
      renderQuestion(s);
      setTimeout(function(){ go(1)(); }, 220);
    }
  }
  function renderCapture(){
    card.innerHTML =
      barHTML("Almost done") +
      '<p class="q">Where should we send your free audit?</p>'+
      '<p class="hint">We’ll prepare a deadline-exposure snapshot of up to 20 of your patents.</p>'+
      '<div class="field"><label for="f-name">Your name</label><input id="f-name" type="text" autocomplete="name" value="'+esc(contact.name)+'"></div>'+
      '<div class="field"><label for="f-email">Work email</label><input id="f-email" type="email" autocomplete="email" placeholder="you@company.com" value="'+esc(contact.email)+'"></div>'+
      '<div class="field"><label for="f-company">Company / firm <span style="color:var(--muted);font-weight:500">(optional)</span></label><input id="f-company" type="text" autocomplete="organization" value="'+esc(contact.company)+'"></div>'+
      '<div class="foot">'+
        '<button class="btn btn-ghost" id="back">Back</button>'+
        '<button class="btn btn-primary" id="next" disabled>Get my free audit</button>'+
      '</div>';
    var nEl=document.getElementById("f-name"), eEl=document.getElementById("f-email"), cEl=document.getElementById("f-company");
    var nextBtn=document.getElementById("next");
    function validate(){
      contact.name=nEl.value.trim(); contact.email=eEl.value.trim(); contact.company=cEl.value.trim();
      var ok = contact.name.length>1 && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(contact.email);
      nextBtn.disabled=!ok;
    }
    [nEl,eEl,cEl].forEach(function(el){ el.oninput=validate; });
    validate();
    document.getElementById("back").onclick = go(-1);
    nextBtn.onclick = submit;
  }
  function submit(){
    var btn=document.getElementById("next");
    btn.disabled=true; btn.textContent="Sending…";
    saveResponse().then(function(ok){ saved=ok; i++; render(); },
                        function(){ saved=false; i++; render(); });
  }
  function renderDone(){
    card.innerHTML =
      '<div class="done">'+
        '<div class="badge">'+checkIcon()+'</div>'+
        '<h1>Thank you'+(contact.name?", "+esc(contact.name.split(" ")[0]):"")+'.</h1>'+
        '<p>Your free portfolio audit is on its way to <b>'+esc(contact.email||"your inbox")+'</b>. '+
        'We’ll be in touch shortly.</p>'+
        '<div class="save-state'+(saved?"":" warn")+'" id="ss">'+
          (saved?"":"We couldn’t reach our server just now — your answers are shown below so nothing is lost. Please email them to IPaxis@proton.me, or try again in a moment.")+
        '</div>'+
        (saved?"":'<button class="copybtn" id="copy">Copy my answers</button>')+
      '</div>';
    if(!saved){
      var c=document.getElementById("copy");
      if(c) c.onclick=function(){
        var txt=summaryText();
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(function(){c.textContent="Copied ✓";},function(){fallbackCopy(txt,c);});
        } else fallbackCopy(txt,c);
      };
    }
  }
  function fallbackCopy(txt,btn){
    try{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);btn.textContent="Copied ✓";}
    catch(e){btn.textContent="Copy failed — select manually";}
  }
  function summaryText(){
    var lines=["IP Axix — Portfolio pain check",""];
    lines.push("Name: "+contact.name); lines.push("Email: "+contact.email); lines.push("Company: "+(contact.company||"—"));
    lines.push("");
    qSteps.forEach(function(s){
      var a=answers[s.id]; lines.push(s.q); lines.push("→ "+(Array.isArray(a)?a.join(", "):(a||"(skipped)"))); lines.push("");
    });
    return lines.join("\n");
  }
  function go(delta){
    return function(){
      i = Math.max(0, Math.min(STEPS.length-1, i+delta));
      render();
      try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){}
    };
  }
  function saveResponse(){
    return fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY},
      body:JSON.stringify({name:contact.name,email:contact.email,company:contact.company,answers:answers,source:"pain-check"})})
      .then(function(r){return r.json();})
      .then(function(j){ return !!(j&&j.ok); })
      .catch(function(){ return false; });
  }
  function giftIcon(){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>';}
  function checkIcon(){return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';}

  render();
})();
</script>
</body>
</html>
